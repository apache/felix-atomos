github:
  description: "Apache Felix Atomos"
  homepage: https://felix.apache.org/
  labels:
    - osgi
    - modules
    - jlink
    - substrate
  ghp_branch: gh-pages
  features:
    issues: true

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
